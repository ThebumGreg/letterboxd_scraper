# docker-compose.yml for the SyncHub worker 'encoder-1'. Generated by SyncHub; generate it again after changing a share.
# Put it next to the .env file and the 'agent' folder from the SyncHub repository, then run:  docker compose up -d --build
services:
  worker:
    build: ./agent
    image: synchub-worker
    container_name: synchub-worker
    init: true
    restart: unless-stopped
    stop_grace_period: 90s
    environment:
      SYNCHUB_URL: ${SYNCHUB_URL:?set SYNCHUB_URL in .env}
      SYNCHUB_TOKEN: ${SYNCHUB_TOKEN:?set SYNCHUB_TOKEN in .env}
      SYNCHUB_NAME: ${SYNCHUB_NAME:-}
      SYNCHUB_WORK: /work      # the share login in .env is used by Docker to mount the shares and is not passed into the container
    volumes:
      - "${WORK_DIR:-./work}:/work"      # job folders, kept originals and logs: use a big local disk
      - "root_media:/mnt/tower/Media"      # media
      - "root_tfiles:/mnt/tower/TFiles"      # tfiles

volumes:
  root_media:
    driver: local
    driver_opts:
      type: cifs
      o: "addr=192.168.1.10,username=${SMB_USER},password=${SMB_PASSWORD},vers=3.0"
      device: "//192.168.1.10/Media"
  root_tfiles:
    driver: local
    driver_opts:
      type: cifs
      o: "addr=192.168.1.10,username=${SMB_USER},password=${SMB_PASSWORD},vers=3.0"
      device: "//192.168.1.10/TFiles"
