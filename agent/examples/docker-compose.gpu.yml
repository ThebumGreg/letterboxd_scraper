# NO LONGER NEEDED for a worker set up with agent/setup-worker.sh: the script finds an Intel/AMD/NVIDIA GPU and adds it to the generated docker-compose.yml itself
# (use --no-gpu to leave it out), and the image now includes the VMAF ffmpeg by default. Kept for workers that were set up by hand.
#
# Lets the worker use an Intel GPU for encoding (VAAPI, or QSV on a chip that supports it). Use it next to the generated docker-compose.yml:
#
#     docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
#
# Then check that the worker found it:  docker compose -f docker-compose.yml -f docker-compose.gpu.yml run --rm worker --check
# (the agent runs as root in the container, so no extra groups are needed; look for hevc_vaapi under "encoders that work"). A plan only uses the GPU when Library settings > GPU encoding is switched on.
# For an NVIDIA GPU use `gpus: all` here instead of `devices`, with the NVIDIA Container Toolkit installed on the PC.
services:
  worker:
    build:
      args:
        FFMPEG_URL: ${FFMPEG_URL:-}      # optional: a static ffmpeg build with libvmaf for VMAF scores, see agent/Dockerfile (put FFMPEG_URL=... in .env)
    devices:
      - /dev/dri:/dev/dri
    environment:
      SYNCHUB_VIDEO_ENCODER: ${SYNCHUB_VIDEO_ENCODER:-auto}   # auto, cpu, nvenc, qsv or vaapi
      # SYNCHUB_VAAPI_DEVICE: /dev/dri/renderD128             # if the GPU is not the first render device
