# Adds port 80 next to 5001, so SyncHub answers on both:   docker compose -f docker-compose.yml -f docker-compose.port80.yml up -d
# The container listens on 80 as well as 5001 (SYNCHUB_EXTRA_PORT); the host side below is what you publish. On Unraid, port 80 is the Unraid page itself,
# so change the left-hand number (for example "8080:80") or give SyncHub its own IP address.
services:
  synchub:
    ports:
      - "${SYNCHUB_PORT_80:-80}:80"
    environment:
      SYNCHUB_EXTRA_PORT: "80"
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"       # the web server runs as PUID:PGID, not root, and ports below 1024 need this
