<!-- templates/logs.html -->
{% extends "base.html" %}

{% block title %}Logs{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
    <h2 class="mb-0"><i class="bi bi-terminal" aria-hidden="true"></i> Logs</h2>
    <div class="d-flex gap-2 align-items-center flex-wrap">
        <div class="form-check form-switch me-2 mb-0">
            <input class="form-check-input" type="checkbox" role="switch" id="autoRefreshToggle" checked>
            <label class="form-check-label" for="autoRefreshToggle">Auto refresh (3s)</label>
        </div>
        <button id="btnRefreshLogs" type="button" class="btn btn-sm btn-outline-info">
            <i class="bi bi-arrow-clockwise" aria-hidden="true"></i> Refresh now
        </button>
        <button id="btnDownloadLogs" type="button" class="btn btn-sm btn-outline-secondary">
            <i class="bi bi-download" aria-hidden="true"></i> Download
        </button>
        <button id="btnClearLogs" type="button" class="btn btn-sm btn-outline-danger">
            <i class="bi bi-trash" aria-hidden="true"></i> Clear view
        </button>
    </div>
</div>

<div id="logError" class="alert alert-warning py-2 d-none" role="alert"></div>

<!-- Filters -->
<div class="panel p-3 mb-4 mx-0">
    <div class="row g-3 align-items-center">
        <div class="col-6 col-md-2">
            <label for="logLevelFilter" class="visually-hidden">Log level</label>
            <select id="logLevelFilter" class="form-select form-select-sm">
                <option value="">All levels</option>
                <option value="DEBUG">DEBUG</option>
                <option value="INFO">INFO</option>
                <option value="WARNING">WARNING</option>
                <option value="ERROR">ERROR</option>
            </select>
        </div>
        <div class="col-6 col-md-2">
            <label for="logLimit" class="visually-hidden">Number of lines</label>
            <select id="logLimit" class="form-select form-select-sm">
                <option value="200">Last 200 lines</option>
                <option value="500" selected>Last 500 lines</option>
                <option value="1000">Last 1000 lines</option>
                <option value="2000">Last 2000 lines</option>
            </select>
        </div>
        <div class="col-md-5">
            <label for="logSearch" class="visually-hidden">Filter log text</label>
            <input type="search" id="logSearch" class="form-control form-control-sm" placeholder="Filter log text..." autocomplete="off">
        </div>
        <div class="col-md-3 text-md-end">
            <span id="followBadge" class="badge text-bg-secondary me-2 d-none">Scroll paused</span>
            <small id="logCount" class="text-body-secondary" aria-live="polite">Showing 0 lines</small>
        </div>
    </div>
</div>

<!-- Console -->
<div class="panel p-2 overflow-hidden">
    <div id="logConsole" class="log-console rounded" role="log" aria-live="off" tabindex="0">Loading logs...</div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/logs.js') }}"></script>
{% endblock %}
