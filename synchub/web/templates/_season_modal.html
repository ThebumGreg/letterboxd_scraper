<div class="modal fade" id="seasonModal" tabindex="-1" aria-labelledby="seasonTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="seasonTitle">Which seasons?</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p class="small text-body-secondary" id="seasonHint"></p>
                <div id="seasonList" class="d-grid gap-2"></div>
                <div class="small mt-3" id="seasonMessage" role="status"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-success" id="seasonAdd" disabled><i class="bi bi-cloud-download" aria-hidden="true"></i> Send to Sonarr</button>
            </div>
        </div>
    </div>
</div>
