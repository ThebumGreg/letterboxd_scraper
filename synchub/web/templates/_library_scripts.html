<script src="{{ url_for('static', filename='js/library.js') }}"></script>
<script>
(() => {
    const $ = (id) => document.getElementById(id);
    const live = $('libraryLive');
    let timer = null;
    async function refresh() {
        try {
            const res = await fetch('/library/fragment');
            if (res.ok && !document.querySelector('.modal.show') && document.getElementById('media-pane-library')?.classList.contains('active')) live.innerHTML = await res.text();
        } catch (e) { /* next time */ }
        schedule();
    }
    function schedule() {
        clearTimeout(timer);
        const active = live.querySelector('#libraryActive')?.dataset.active === '1';
        timer = setTimeout(refresh, active ? 4000 : 30000);
    }
    schedule();

    $('scanForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const data = await libraryPost('/api/library/scan', { root: $('scanRoot').value, prefix: $('scanPrefix').value, integrity: $('scanIntegrity').value, profile_id: $('scanProfile').value, force: $('scanForce').checked, exclude: $('scanExclude').value });
        librarySay(data.message || (data.ok ? 'Scan queued.' : 'Failed.'), data.ok);
        if (data.ok) refresh();
    });
    $('dupBtn').addEventListener('click', async () => {
        const data = await libraryPost('/api/library/duplicates');
        librarySay(data.message || (data.ok ? 'Done.' : 'Failed.'), data.ok);
        if (data.ok) refresh();
    });
    document.addEventListener('click', async (e) => {
        const requeue = e.target.closest('[data-requeue]');
        if (requeue) {
            const data = await libraryPost(`/api/library/record/${requeue.dataset.requeue}/requeue`);
            librarySay(data.message || (data.ok ? 'Queued.' : 'Failed.'), data.ok);
            refresh();
            return;
        }
        if (e.target.closest('[data-queue-approved]')) {
            const data = await libraryPost('/api/library/queue-approved');
            librarySay(data.message || (data.ok ? 'Queued.' : 'Failed.'), data.ok);
            refresh();
            return;
        }
        const make = e.target.closest('[data-make-preview]');
        if (make) {
            make.disabled = true;
            const data = await libraryPost('/api/library/previews', { subject_type: make.dataset.makePreview, subject_id: make.dataset.id });
            librarySay(data.message || (data.ok ? 'Queued.' : 'Failed.'), data.ok);
            if (data.ok && data.url) setTimeout(() => { location.href = data.url; }, 600); else make.disabled = false;
            return;
        }
        const download = e.target.closest('[data-download]');
        if (download) {
            const data = await libraryPost(`/api/downloads/${download.dataset.id}/${download.dataset.download}`);
            librarySay(data.message || (data.ok ? 'Done.' : 'Failed.'), data.ok);
            refresh();
            return;
        }
        const cancel = e.target.closest('[data-cancel-run]');
        if (!cancel) return;
        if (cancel.dataset.confirm && !confirm(cancel.dataset.confirm)) return;
        const data = await libraryPost(`/api/library/runs/${encodeURIComponent(cancel.dataset.cancelRun)}/cancel`);
        librarySay(data.message || 'Done.', data.ok);
        refresh();
    });
})();
</script>
