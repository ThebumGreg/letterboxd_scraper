<script>
(() => {
    const csrf = document.querySelector('meta[name="csrf-token"]')?.content || '';
    const box = document.getElementById('originalsMessage');
    const say = (ok, text) => { box.className = 'alert alert-' + (ok ? 'success' : 'danger'); box.textContent = text; };
    document.querySelectorAll('[data-delete-source]').forEach((button) => {
        button.addEventListener('click', async () => {
            if (!confirm('Delete the original of "' + button.dataset.name + '" now? A worker first checks that the converted copy is on its share and unchanged. This cannot be undone.')) return;
            button.disabled = true;
            try {
                const res = await fetch('/api/library/record/' + button.dataset.deleteSource + '/delete-source-now', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrf }, body: '{}' });
                const data = await res.json();
                say(data.ok, data.message);
                if (data.ok) setTimeout(() => location.reload(), 1200); else button.disabled = false;
            } catch (e) { say(false, 'Could not reach the server.'); button.disabled = false; }
        });
    });
    document.querySelectorAll('[data-original-action]').forEach((button) => {
        button.addEventListener('click', async () => {
            const action = button.dataset.originalAction, name = button.dataset.name;
            let days = null;
            if (action === 'restore' && !confirm('Put the original of "' + name + '" back? The converted file is moved aside (kept 7 days), not deleted. Radarr/Sonarr and Jellyfin pick the change up on their next scan.')) return;
            if (action === 'purge' && !confirm('Delete the kept original of "' + name + '" now? This cannot be undone.')) return;
            if (action === 'extend') { days = prompt('Keep it for how many more days (from today)?', '30'); if (days === null) return; }
            button.disabled = true;
            try {
                const res = await fetch('/api/worker_originals/' + button.dataset.worker, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrf }, body: JSON.stringify({ id: button.dataset.id, action, days }) });
                const data = await res.json();
                say(data.ok, data.message);
                if (data.ok) setTimeout(() => location.reload(), 1200); else button.disabled = false;
            } catch (e) { say(false, 'Could not reach the server.'); button.disabled = false; }
        });
    });
    const hiddenPost = async (url, payload, done) => {
        try {
            const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrf }, body: JSON.stringify(payload) });
            const data = await res.json();
            say(data.ok, data.message);
            if (data.ok) setTimeout(() => location.reload(), 1200);
        } catch (e) { say(false, 'Could not reach the server.'); }
        if (done) done();
    };
    const picks = () => [...document.querySelectorAll('[data-hidden-pick]:checked')];
    const refreshPicks = () => {
        const on = picks(), bytes = on.reduce((n, c) => n + Number(c.dataset.size || 0), 0);
        const label = document.getElementById('hiddenSelected');
        if (label) label.textContent = on.length ? on.length + ' selected, ' + (bytes / 1073741824).toFixed(2) + ' GB' : 'Nothing selected';
        document.querySelectorAll('[data-hidden-bulk]').forEach((b) => { b.disabled = !on.length; });
    };
    document.querySelectorAll('[data-hidden-pick]').forEach((c) => c.addEventListener('change', refreshPicks));
    document.getElementById('hiddenAll')?.addEventListener('change', (e) => { document.querySelectorAll('[data-hidden-pick]:not(:disabled)').forEach((c) => { c.checked = e.target.checked; }); refreshPicks(); });
    document.querySelectorAll('[data-hidden-bulk]').forEach((b) => b.addEventListener('click', () => {
        const on = picks(), action = b.dataset.hiddenBulk, gb = (on.reduce((n, c) => n + Number(c.dataset.size || 0), 0) / 1073741824).toFixed(2);
        if (action === 'delete' && !confirm('Delete ' + on.length + ' hidden file(s), ' + gb + ' GB, for good? A worker first checks each film still has its other file. This cannot be undone.')) return;
        b.disabled = true;
        hiddenPost('/api/library/hidden/act', { action, ids: on.map((c) => Number(c.dataset.hiddenPick)) }, () => { b.disabled = false; });
    }));
    document.querySelectorAll('[data-hidden-one]').forEach((b) => b.addEventListener('click', () => {
        const action = b.dataset.hiddenOne;
        if (action === 'delete' && !confirm('Delete "' + b.dataset.name + '" for good? A worker first checks the film still has its other file. This cannot be undone.')) return;
        b.disabled = true;
        hiddenPost('/api/library/hidden/act', { action, ids: [Number(b.dataset.id)] }, () => { b.disabled = false; });
    }));
    document.getElementById('hiddenDays')?.addEventListener('change', async (e) => {
        const days = e.target.value;
        if (days !== '0' && !confirm('Hidden files will be deleted for good ' + days + ' days after they were hidden, with a notification the day before. Files hidden longer than that are noticed first, then deleted a day later. Turn this on?')) { location.reload(); return; }
        hiddenPost('/api/library/hidden/delete-after', { days });
    });
})();
</script>
