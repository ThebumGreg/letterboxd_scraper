<script>
(() => {
    const $ = (id) => document.getElementById(id);
    const say = (text, ok) => librarySay(text, ok, 'optMessage');
    const sizeValues = () => ({ size_policy: '1', tv_size_policy: $('setTvPolicy').checked ? '1' : '0', cap_mbps_2160: $('setCap2160').value, cap_mbps_1080: $('setCap1080').value, cap_mbps_720: $('setCap720').value,
        cap_mbps_sd: $('setCapSd').value, size_trigger_factor: $('setTrigger').value, safety_gb_2160: $('setSafety2160').value, safety_gb_1080: $('setSafety1080').value, tv_cap_share: $('setTvShare').value });
    $('sizePreviewBtn').addEventListener('click', async () => {
        const out = $('sizePreviewOut');
        out.textContent = 'Counting...';
        try {
            const r = await fetch('/api/library/size_preview', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(sizeValues()) });
            const d = await r.json();
            out.textContent = d.message || d.error || 'No answer.';
        } catch (e) { out.textContent = 'Could not count.'; }
    });
    $('librarySettingsForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const data = await libraryPost('/api/library/settings', { library_destination_root: $('setDest').value, library_movie_folder: $('setMovies').value, library_tv_folder: $('setTv').value,
            library_integrity_mode: $('setIntegrity').value, library_tail_seconds: $('setTail').value, library_exclude_folders: $('setExclude').value,
            download_pipeline: $('setDownloads').value, originals_retention_days: $('setOriginals').value,
            ...sizeValues(), size_mode: 'bitrate', size_policy: $('setSizePolicy').checked ? '1' : '0', size_crf: $('setSizeCrf').value,
            versions_on: $('vOn').checked ? '1' : '0', variant_min_gb: $('vMinGb').value, variant_height: $('vHeight').value, variant_label: $('vLabel').value, variant_crf: $('vCrf').value,
            variant_maxrate_kbps: $('vRate').value, variant_audio_kbps: $('vAudio').value, variant_stereo: $('vStereo').checked ? '1' : '0', dv7_remux: $('vDv7').checked ? '1' : '0',
            naming_style: $('setNaming').value, audio_mode: $('setAudio').value, clean_names: $('setCleanNames').checked ? '1' : '0', naming_tmdb_ids: $('setTmdbIds').checked ? '1' : '0', gpu_encoding: $('setGpu').value, vmaf_mode: $('setVmaf').value,
            dolby_vision_profile_5: $('setDv5').value, dolby_vision_profile_7_8: $('setDv78').value,
            review_first: $('setReviewFirst').value, trust_after: $('setTrustAfter').value, preview_seconds: $('setPreviewSeconds').value, preview_auto: $('setPreviewAuto').checked ? '1' : '0',
            library_default_profile: $('setProfile').value, source_delete_after_days: $('setSourceDelete').value, arr_after_migration: $('setArr').value, arr_apply_when: $('setArrWhen').value });
        say(data.message || (data.ok ? 'Saved.' : 'Failed.'), data.ok);
        if (data.ok) setTimeout(() => location.reload(), 600);
    });
    const pf = (id) => $(id);
    function fillProfile(p, copy) {
        pf('pfId').value = copy ? '' : p.id; pf('pfName').value = copy ? p.name + ' copy' : p.name; pf('pfCodec').value = p.video_codec; pf('pfSubs').value = p.subtitles;
        pf('pfCrf').value = p.crf || ''; pf('pfPreset').value = p.preset || 'medium'; pf('pfAudio').value = p.audio_kbps; pf('pfTenBit').checked = !!p.ten_bit; pf('pfMoveOnly').checked = !!p.move_only; pf('pfDesc').value = p.description || '';
        document.querySelectorAll('[data-rule]').forEach((el) => { const v = (p.rules || {})[el.dataset.rule]; el.value = v === undefined ? '' : (v === true ? '1' : v === false ? '0' : String(v)); });
        pf('pfName').focus();
    }
    $('profileForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const rules = {};
        document.querySelectorAll('[data-rule]').forEach((el) => { if (el.value !== '') rules[el.dataset.rule] = el.value; });
        const data = await libraryPost('/api/library/profiles', { id: pf('pfId').value, name: pf('pfName').value, video_codec: pf('pfCodec').value, subtitles: pf('pfSubs').value, crf: pf('pfCrf').value,
            preset: pf('pfPreset').value, audio_kbps: pf('pfAudio').value, ten_bit: pf('pfTenBit').checked, move_only: pf('pfMoveOnly').checked, description: pf('pfDesc').value, rules });
        say(data.message || (data.ok ? 'Saved.' : 'Failed.'), data.ok);
        if (data.ok) setTimeout(() => location.reload(), 600);
    });
    $('pfClear').addEventListener('click', () => { $('profileForm').reset(); pf('pfId').value = ''; });
    document.addEventListener('click', async (e) => {
        const edit = e.target.closest('[data-profile-edit]');
        if (edit) { const p = JSON.parse(edit.dataset.profileEdit); fillProfile(p, p.builtin); return; }
        const del = e.target.closest('[data-profile-delete]');
        if (del) {
            if (!confirm('Delete this profile?')) return;
            const data = await libraryPost(`/api/library/profiles/${del.dataset.profileDelete}/delete`);
            say(data.message || (data.ok ? 'Deleted.' : 'Failed.'), data.ok);
            if (data.ok) setTimeout(() => location.reload(), 600);
            return;
        }
    });
})();
</script>

{% if qual %}
<script>
(() => {
    const token = document.querySelector('meta[name="csrf-token"]')?.content || '';
    const $ = (id) => document.getElementById(id);
    const value = (id) => $(id).value;
    const post = (url, body) => fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-CSRFToken': token }, body: JSON.stringify(body) }).then((r) => r.json().catch(() => ({})));
    const qSay = (data, fallback) => { const out = $('qSaved'); out.className = 'small ms-2 ' + (data.ok ? 'text-success' : 'text-danger'); out.textContent = data.message || (data.ok ? 'Done.' : fallback); };
    if ($('qReset')) $('qReset').addEventListener('click', () => { for (const id of ['qSamples', 'qSlice', 'qMin', 'qBelow']) $(id).value = $(id).dataset.recommended; $('qSaved').textContent = 'Recommended numbers filled in. Press Save to keep them.'; $('qSaved').className = 'small ms-2 text-body-secondary'; });
    for (const [id, url] of [['qStopAll', '/api/library/quality/stop-all'], ['qClear', '/api/library/quality/clear']]) {
        if ($(id)) $(id).addEventListener('click', async () => {
            if (!confirm($(id).dataset.confirm)) return;
            try { qSay(await post(url, {}), 'Failed.'); } catch (e) { qSay({ ok: false }, 'Could not reach the server.'); }
        });
    }
    if ($('qSave')) $('qSave').addEventListener('click', async () => {
        const out = $('qSaved');
        const body = { quality_samples: value('qSamples'), quality_slice_seconds: value('qSlice'), quality_flag_below: value('qBelow'), quality_min_height: value('qMin'), quality_on_download: value('qDownload'), quality_scan_library: value('qPass'), quality_scan_order: value('qOrder'), quality_paused: value('qPaused'), quality_damage_pass: value('qDamage'), quality_check_first: value('qFirst') };
        try {
            const data = await post('/api/library/quality/settings', body);
            out.className = 'small ms-2 ' + (data.ok ? 'text-success' : 'text-danger');
            out.textContent = data.message || (data.ok ? 'Saved.' : 'Failed.');
        } catch (e) { out.className = 'small ms-2 text-danger'; out.textContent = 'Could not reach the server.'; }
    });
    // The AI test card: pick a file, choose Standard / AI / Both, run, and watch the results table.
    if (!$('aiTest')) return;
    let picked = null, names = {}, typing = null;
    $('aiFile').addEventListener('input', () => {
        clearTimeout(typing);
        const text = $('aiFile').value.trim();
        if (names[text]) { picked = names[text]; $('aiPicked').textContent = 'Chosen: ' + text; return; }
        picked = null; $('aiPicked').textContent = 'No file chosen.';
        if (text.length < 2) return;
        typing = setTimeout(async () => {
            try {
                const res = await fetch('/api/library/quality/ai/files?q=' + encodeURIComponent(text));
                const data = await res.json();
                names = {}; const list = $('aiFiles'); list.textContent = '';
                (data.files || []).forEach((f) => { names[f.label] = f.id; const o = document.createElement('option'); o.value = f.label; list.appendChild(o); });
                if (names[$('aiFile').value.trim()]) { picked = names[$('aiFile').value.trim()]; $('aiPicked').textContent = 'Chosen: ' + $('aiFile').value.trim(); }
            } catch (e) { /* the next keystroke tries again */ }
        }, 250);
    });
    async function refresh() {
        try {
            const res = await fetch('/library/quality/ai');
            if (res.ok && $('media-pane-options')?.classList.contains('active')) $('aiResults').innerHTML = await res.text();
        } catch (e) { /* next time */ }
    }
    setInterval(refresh, 5000);
    $('aiRun').addEventListener('click', async () => {
        const out = $('aiOut');
        if (!picked) { out.className = 'small mt-1 text-danger'; out.textContent = 'Choose a file from the list first.'; return; }
        const mode = document.querySelector('input[name="aiMode"]:checked')?.value || 'standard';
        $('aiRun').disabled = true;
        try {
            const data = await post('/api/library/quality/ai/run', { file_id: picked, mode });
            out.className = 'small mt-1 ' + (data.ok ? 'text-success' : 'text-danger');
            out.textContent = data.message || (data.ok ? 'Started.' : 'Failed.');
            if (data.ok) refresh();
        } catch (e) { out.className = 'small mt-1 text-danger'; out.textContent = 'Could not reach the server.'; }
        $('aiRun').disabled = false;
    });
})();
</script>
{% endif %}
