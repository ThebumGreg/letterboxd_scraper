<script>
(() => {
    const token = document.querySelector('meta[name="csrf-token"]')?.content || '';
    const fleet = document.getElementById('fleet'), message = document.getElementById('fleetMessage');
    const modal = (id) => bootstrap.Modal.getOrCreateInstance(document.getElementById(id));
    const post = async (url, body) => {
        try {
            const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-CSRFToken': token }, body: JSON.stringify(body || {}) });
            return await res.json();
        } catch (e) { return { ok: false, message: 'Could not reach the server.' }; }
    };
    const say = (text, ok) => { message.className = 'alert ' + (ok ? 'alert-success' : 'alert-danger'); message.textContent = text; };
    const busy = () => document.querySelector('.modal.show, .dropdown-menu.show');

    async function refresh() {
        if (busy() || !document.getElementById('media-pane-workers')?.classList.contains('active')) return;
        try {
            const res = await fetch('/workers/fragment');
            if (res.ok && !busy()) { fleet.innerHTML = await res.text(); showPane(); }
        } catch (e) { /* the next tick tries again */ }
    }
    setInterval(refresh, 5000);

    // Workers, Jobs and Worker Status are tabs of one live fragment, so the open tab is remembered here (and in the address) across the refreshes.
    let pane = ['jobs', 'status'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'workers';
    function showPane() {
        fleet.querySelectorAll('[data-fleet-pane]').forEach((el) => { el.hidden = el.dataset.fleetPane !== pane; });
        fleet.querySelectorAll('#fleetTabs [data-pane]').forEach((tab) => {
            const on = tab.dataset.pane === pane;
            tab.classList.toggle('active', on);
            tab.setAttribute('aria-selected', on ? 'true' : 'false');
        });
    }
    fleet.addEventListener('click', (e) => {
        const tab = e.target.closest('#fleetTabs [data-pane]');
        if (!tab) return;
        pane = tab.dataset.pane;
        history.replaceState(null, '', '#' + pane);
        showPane();
    });
    showPane();

    // Setup files. Right after a token is made they hold it; nothing keeps them once the dialog closes.
    const NOTES = {
        'setup-worker.sh': 'Run these on the worker PC. The script does everything on the other tabs for you; those files are here to read, or to set up by hand.',
        '.env': 'Save as .env next to docker-compose.yml (then chmod 600 .env) and fill in the Unraid user and password for the shares.',
        'docker-compose.yml': 'Save next to .env and the agent folder from the SyncHub repository, then run: docker compose up -d --build',
        'synchub-agent.ini': 'Only for a worker that runs without Docker: python3 synchub_agent.py --config synchub-agent.ini',
        'fstab': 'Only for a worker that runs without Docker: add these lines to /etc/fstab so the shares mount at boot.',
    };
    let setup = null, activeFile = null;
    const shown = () => {
        if (!setup) return '';
        const address = document.getElementById('setupUrl').value.trim() || setup.url;
        return (setup.files[activeFile] || '').split(setup.url).join(address);
    };
    function paintSetup() {
        document.getElementById('setupText').textContent = shown();
        document.getElementById('setupNote').textContent = NOTES[activeFile] || '';
        document.querySelectorAll('#setupTabs .nav-link').forEach((tab) => {
            const on = tab.dataset.file === activeFile;
            tab.classList.toggle('active', on);
            tab.setAttribute('aria-selected', on ? 'true' : 'false');
        });
    }
    function showSetup(data, title) {
        setup = data.setup;
        activeFile = setup.order[0];
        document.getElementById('setupTitle').textContent = title;
        document.getElementById('copyResult').textContent = '';
        const input = document.getElementById('setupUrl');
        input.value = setup.url;
        document.getElementById('setupUrlHint').textContent = /\/\/(localhost|127\.|\[::1\])/.test(setup.url) ? 'You opened SyncHub as localhost; use this PC\'s address on your network, such as http://192.168.1.20:5001.' : '';
        const token = document.getElementById('setupToken');
        token.className = 'small mb-2 ' + (setup.has_token ? 'text-warning' : 'text-body-secondary');
        token.textContent = setup.has_token ? 'The token is in these files and is shown only now. If it is lost, make a new one (the old one stops working).'
            : 'The token is not shown again. Replace the placeholder with the token you saved, or choose New token for this worker.';
        const tabs = document.getElementById('setupTabs');
        tabs.textContent = '';
        setup.order.forEach((name) => {
            const li = document.createElement('li'); li.className = 'nav-item'; li.setAttribute('role', 'presentation');
            const b = document.createElement('button'); b.type = 'button'; b.className = 'nav-link'; b.dataset.file = name; b.textContent = name; b.setAttribute('role', 'tab');
            b.addEventListener('click', () => { activeFile = name; paintSetup(); });
            li.appendChild(b); tabs.appendChild(li);
        });
        if (!setup.shares) document.getElementById('setupNote').textContent = '';
        paintSetup();
        modal('setupModal').show();
    }
    document.getElementById('setupUrl').addEventListener('input', paintSetup);
    document.getElementById('setupModal').addEventListener('hidden.bs.modal', () => {
        setup = null; activeFile = null;
        document.getElementById('setupText').textContent = ''; document.getElementById('setupUrl').value = ''; document.getElementById('setupTabs').textContent = '';
    });
    document.getElementById('copySetup').addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(shown()); document.getElementById('copyResult').textContent = 'Copied.'; }
        catch (e) { document.getElementById('copyResult').textContent = 'Select the text and copy it.'; }
    });


    // A worker's own log. Asking makes the worker upload the tail of its log with its next poll (a few seconds).
    const wl = { id: null, name: '', raw: null, received: null, timer: null, asking: false };
    const wlEl = (id) => document.getElementById(id);
    const wlStop = () => { clearInterval(wl.timer); wl.timer = null; wl.asking = false; wlEl('wlRefresh').classList.remove('disabled'); wlEl('wlRefresh').setAttribute('aria-disabled', 'false'); };
    const LEVELS = { DEBUG: 0, INFO: 1, WARNING: 2, ERROR: 3, CRITICAL: 3 };
    function wlLine(line) {            // the agent writes one JSON object per line; anything else is shown as it is
        try {
            const o = JSON.parse(line);
            if (o && typeof o === 'object' && o.msg !== undefined) {
                const { ts, level, msg, error, ...rest } = o;
                const extra = Object.entries(rest).map(([k, v]) => `${k}=${typeof v === 'object' ? JSON.stringify(v) : v}`).join(' ');
                return { level: LEVELS[String(level).toUpperCase()] ?? 1, text: `${ts || ''} ${String(level || '').padEnd(7)} ${msg}${extra ? '  ' + extra : ''}${error ? '\n' + error : ''}` };
            }
        } catch (e) { /* not JSON */ }
        return { level: null, text: line };
    }
    function wlPaint() {
        const pre = wlEl('wlText');
        if (wl.raw === null) { pre.textContent = ''; return; }
        const min = Number(wlEl('wlLevel').value), needle = wlEl('wlSearch').value.trim().toLowerCase();
        const all = wl.raw.split('\n').filter((l) => l.trim() !== '').map(wlLine);
        const shown = all.filter((l) => (l.level === null ? min === 0 : l.level >= min) && (!needle || l.text.toLowerCase().includes(needle)));
        pre.textContent = shown.length ? shown.map((l) => l.text).join('\n') : (all.length ? 'No line matches.' : '(the log is empty)');
        pre.scrollTop = pre.scrollHeight;
        wlEl('wlStatus').dataset.count = `${shown.length} of ${all.length} lines`;
        wlStatusText();
    }
    // The status line has three parts: where the log on screen came from, what the page is waiting for, and how many lines are shown.
    function wlStatusText(shown, ask) {
        const el = wlEl('wlStatus');
        if (shown !== undefined) el.dataset.shown = shown;
        if (ask !== undefined) el.dataset.ask = ask;
        el.textContent = [el.dataset.shown, el.dataset.ask, el.dataset.count].filter(Boolean).join(' \u00b7 ');
    }
    async function wlLook(waiting) {
        const data = await (await fetch(`/api/workers/${wl.id}/log`)).json();
        if (!data.ok) { wlStatusText('', data.message || 'Could not read the log.'); wlStop(); return; }
        const fresh = data.log && data.log.received_at !== wl.received;
        if (data.log && (!waiting || fresh)) {
            wl.raw = data.log.content; wl.received = data.log.received_at;
            wlStatusText(`From ${data.name}, ${data.log.received}${data.log.truncated ? ' (the oldest lines were left out)' : ''}`, waiting ? '' : undefined);
            wlPaint();
            if (waiting) wlStop();
        } else if (waiting) {
            wlStatusText(undefined, data.online ? `waiting for ${data.name} to answer...` : `${data.name} is offline: a fresh log arrives when it is back`);
        }
        return data;
    }
    async function wlAsk() {
        if (wl.asking) return;
        wl.asking = true; wlEl('wlRefresh').classList.add('disabled'); wlEl('wlRefresh').setAttribute('aria-disabled', 'true');
        const data = await post(`/api/workers/${wl.id}/log`);
        if (!data.ok) { wlStatusText('', data.message || 'Failed.'); wlStop(); return; }
        wlStatusText(undefined, wl.raw === null ? data.message : 'asked the worker for a fresh one');
        clearInterval(wl.timer);
        let tries = 0;
        wl.timer = setInterval(() => {
            if (++tries > 40) { wlStop(); wlStatusText(undefined, 'the worker has not answered. If its agent is older than 0.4.0 it cannot send its log: update it (sudo ./agent/setup-worker.sh)'); return; }
            wlLook(true);
        }, 2000);
    }
    async function openWorkerLog(id, name) {
        Object.assign(wl, { id, name, raw: null, received: null });
        wlEl('workerLogTitle').textContent = `Log of ${name}`;
        wlEl('wlSearch').value = ''; Object.assign(wlEl('wlStatus').dataset, { count: '', shown: '', ask: '' });
        wlPaint(); wlStatusText('', '');
        modal('workerLogModal').show();
        await wlLook(false);          // the last log it sent, if any, while a fresh one is on its way
        wlAsk();
    }
    wlEl('wlRefresh').addEventListener('click', wlAsk);
    wlEl('wlLevel').addEventListener('change', wlPaint);
    wlEl('wlSearch').addEventListener('input', wlPaint);
    wlEl('wlCopy').addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(wlEl('wlText').textContent); wlStatusText(undefined, 'copied what is shown'); } catch (e) { wlStatusText(undefined, 'select the text and copy it'); }
    });
    wlEl('wlDownload').addEventListener('click', () => {
        if (wl.raw === null) return;
        const url = URL.createObjectURL(new Blob([wl.raw], { type: 'text/plain' }));
        const a = Object.assign(document.createElement('a'), { href: url, download: `synchub-worker-${wl.name.replace(/[^A-Za-z0-9._-]+/g, '_')}.jsonl` });
        document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    });
    wlEl('workerLogModal').addEventListener('hidden.bs.modal', () => { wlStop(); wl.raw = null; wlEl('wlText').textContent = ''; });

    // Add or edit a worker
    let editing = null;
    const form = document.getElementById('workerForm');
    function openForm(title, values) {
        document.getElementById('workerModalTitle').textContent = title;
        document.getElementById('workerName').value = values.name || '';
        document.getElementById('workerTags').value = values.tags || '';
        document.getElementById('workerSlots').value = values.slots || 1;
        document.getElementById('workerError').textContent = '';
        modal('workerModal').show();
    }
    document.getElementById('addWorkerBtn').addEventListener('click', () => { editing = null; openForm('Add worker', {}); });
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const body = { name: document.getElementById('workerName').value, tags: document.getElementById('workerTags').value, slots: document.getElementById('workerSlots').value };
        const data = await post(editing ? `/api/workers/${editing}/update` : '/api/workers', body);
        if (!data.ok) { document.getElementById('workerError').textContent = data.message || 'Failed.'; return; }
        modal('workerModal').hide();
        if (!editing) showSetup(data, 'Set up the new worker'); else say(data.message, true);
        refresh();
    });

    // Test copy
    const fill = (select, items) => { select.textContent = ''; items.forEach(([value, label]) => { const o = document.createElement('option'); o.value = value; o.textContent = label; select.appendChild(o); }); };
    document.getElementById('testCopyBtn').addEventListener('click', async () => {
        const res = await fetch('/api/workers'); const data = await res.json();
        if (!data.ok) { say('Could not load the shares.', false); return; }
        const roots = (data.root_names || []).map((n) => [n, n]);
        fill(document.getElementById('tcWorker'), [['', 'Any worker'], ...data.workers.filter((w) => !w.revoked).map((w) => [String(w.id), w.name])]);
        fill(document.getElementById('tcSourceRoot'), roots); fill(document.getElementById('tcDestRoot'), roots);
        document.getElementById('copySubmit').disabled = !roots.length;
        document.getElementById('copyError').textContent = roots.length ? '' : 'Add the shares on the Storage page first.';
        modal('copyModal').show();
    });
    document.getElementById('copyForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const v = (id) => document.getElementById(id).value;
        const data = await post('/api/jobs/test-copy', { worker_id: v('tcWorker'), source_root: v('tcSourceRoot'), source_rel: v('tcSourcePath'), dest_root: v('tcDestRoot'), dest_rel: v('tcDestPath') });
        if (!data.ok) { document.getElementById('copyError').textContent = data.message || 'Failed.'; return; }
        modal('copyModal').hide();
        say(data.message, true);
        refresh();
    });

    // Buttons in the (re-rendered) tables
    let deciding = null;
    document.addEventListener('click', async (e) => {
        const edit = e.target.closest('[data-edit-worker]');
        if (edit) { editing = edit.dataset.editWorker; openForm('Edit worker', { name: edit.dataset.name, tags: edit.dataset.tags, slots: edit.dataset.slots }); return; }

        const logs = e.target.closest('[data-worker-logs]');
        if (logs) { openWorkerLog(logs.dataset.workerLogs, logs.dataset.name); return; }

        const files = e.target.closest('[data-setup-worker]');
        if (files) {
            const res = await fetch(`/api/workers/${files.dataset.setupWorker}/setup`);
            const data = await res.json();
            if (data.ok) showSetup(data, `Setup files for ${data.name}`); else say(data.message || 'Could not load the setup files.', false);
            return;
        }

        const action = e.target.closest('[data-worker-action], [data-job-action]');
        if (action) {
            if (action.dataset.confirm && !confirm(action.dataset.confirm)) return;
            const url = action.dataset.workerAction ? `/api/workers/${action.dataset.id}/${action.dataset.workerAction}` : `/api/jobs/${action.dataset.id}/${action.dataset.jobAction}`;
            const data = await post(url);
            if (data.setup) showSetup(data, 'Set up the worker with its new token'); else say(data.message || (data.ok ? 'Done.' : 'Failed.'), data.ok);
            refresh();
            return;
        }

        const review = e.target.closest('[data-review-job]');
        if (review) {
            deciding = review.dataset.reviewJob;
            document.getElementById('decisionTitle').textContent = `Job #${deciding} is waiting for you`;
            document.getElementById('decisionReason').textContent = review.dataset.reason || 'The worker is not sure what to do.';
            document.getElementById('decisionNote').value = '';
            document.getElementById('decisionError').textContent = '';
            modal('decisionModal').show();
            return;
        }

        const decision = e.target.closest('[data-decision]');
        if (decision && deciding) {
            const data = await post(`/api/jobs/${deciding}/${decision.dataset.decision}`, { note: document.getElementById('decisionNote').value });
            if (!data.ok) { document.getElementById('decisionError').textContent = data.message || 'Failed.'; return; }
            modal('decisionModal').hide();
            say(data.message, true);
            refresh();
            return;
        }

        const details = e.target.closest('[data-job-details]');
        if (details) {
            e.preventDefault();
            const res = await fetch(`/api/jobs/${details.dataset.jobDetails}`);
            const data = await res.json();
            if (!data.ok) { say(data.message || 'Could not load the job.', false); return; }
            renderJob(data.job);
            modal('jobModal').show();
        }
    });

    function renderJob(job) {
        const body = document.getElementById('jobBody');
        body.textContent = '';
        document.getElementById('jobModalTitle').textContent = `#${job.id} ${job.title || job.kind}`;
        const facts = [['Status', job.status.replace('_', ' ')], ['Stage', job.stage], ['Worker', job.worker_name], ['Source', job.source_root ? `${job.source_root}: ${job.source_rel}` : null],
                       ['Destination', job.dest_root ? `${job.dest_root}: ${job.dest_rel}` : null], ['Tries', `${job.attempts} of ${job.max_attempts}`],
                       ['Waiting because', job.review_reason], ['Last error', job.error ? `${job.error_class}: ${job.error}` : null], ['Message', job.message], ['Created', job.created_at], ['Finished', job.finished_at]];
        const list = document.createElement('dl');
        list.className = 'row small';
        facts.filter(([, value]) => value).forEach(([label, value]) => {
            const dt = document.createElement('dt'); dt.className = 'col-sm-3'; dt.textContent = label;
            const dd = document.createElement('dd'); dd.className = 'col-sm-9'; dd.textContent = value;
            list.append(dt, dd);
        });
        body.appendChild(list);
        if (job.decision && job.decision.action) {
            const note = document.createElement('p');
            note.className = 'small text-body-secondary';
            note.textContent = `Last decision: ${job.decision.action} by ${job.decision.by} at ${job.decision.at}${job.decision.note ? ' (' + job.decision.note + ')' : ''}`;
            body.appendChild(note);
        }
        const title = document.createElement('h6'); title.textContent = 'Attempts'; body.appendChild(title);
        (job.attempt_history || []).forEach((a) => {
            const box = document.createElement('div'); box.className = 'border rounded p-2 mb-2 small';
            const head = document.createElement('div'); head.className = 'fw-semibold';
            head.textContent = `#${a.attempt_no} on ${a.worker_name || 'a worker'}: ${a.outcome || 'running'}${a.error_class ? ' (' + a.error_class + ')' : ''}`;
            box.appendChild(head);
            [['Started', a.started_at], ['Finished', a.finished_at], ['Error', a.error]].filter(([, v]) => v).forEach(([label, v]) => {
                const line = document.createElement('div'); line.textContent = `${label}: ${v}`; box.appendChild(line);
            });
            ['command', 'log_tail'].forEach((key) => {
                if (!a[key]) return;
                const pre = document.createElement('pre'); pre.className = 'mt-2 mb-0 p-2 rounded border'; pre.style.whiteSpace = 'pre-wrap'; pre.textContent = a[key];
                const label = document.createElement('div'); label.className = 'mt-2 text-body-secondary'; label.textContent = key === 'command' ? 'Command' : 'Log tail';
                box.append(label, pre);
            });
            body.appendChild(box);
        });
        if (!(job.attempt_history || []).length) body.appendChild(Object.assign(document.createElement('p'), { className: 'small text-body-secondary', textContent: 'No attempts yet.' }));
        body.appendChild(logSection(job.id));
    }

    // The full log lives on the worker; asking for it makes the worker upload it with its next poll.
    let logTimer = null;
    const stopLog = () => { clearInterval(logTimer); logTimer = null; };
    document.getElementById('jobModal').addEventListener('hidden.bs.modal', stopLog);
    function logSection(id) {
        const box = document.createElement('div'); box.className = 'mt-3';
        const head = document.createElement('div'); head.className = 'd-flex align-items-center gap-2 mb-2';
        const title = document.createElement('h6'); title.className = 'mb-0'; title.textContent = 'Full log';
        const button = document.createElement('button'); button.type = 'button'; button.className = 'btn btn-sm btn-outline-info'; button.textContent = 'Fetch full log';
        const status = document.createElement('span'); status.className = 'small text-body-secondary'; status.setAttribute('role', 'status');
        const pre = document.createElement('pre'); pre.className = 'p-2 rounded border d-none'; pre.style.whiteSpace = 'pre-wrap'; pre.style.maxHeight = '40vh'; pre.style.overflow = 'auto';
        head.append(title, button, status); box.append(head, pre);
        let before = null, asking = false;
        const lock = (on) => { asking = on; button.classList.toggle('disabled', on); button.setAttribute('aria-disabled', on ? 'true' : 'false'); };   // not `disabled`: that would drop the keyboard focus
        async function look(waiting) {
            const res = await fetch(`/api/jobs/${id}/log`); const data = await res.json();
            if (!data.ok) { status.textContent = data.message || 'Could not read the log.'; stopLog(); return; }
            const fresh = data.log && data.log.received_at !== before;
            if (data.log && (!waiting || fresh)) {
                pre.textContent = data.log.content; pre.classList.remove('d-none');
                status.textContent = `From ${data.log.worker_name || 'a worker'}, ${data.log.received}${data.log.truncated ? ' (the start was left out)' : ''}.`;
                if (waiting) { stopLog(); lock(false); }
            } else if (waiting) {
                status.textContent = data.holder_online ? `Waiting for ${data.holder}...` : `${data.holder || 'The worker'} is offline: the log arrives when it is back.`;
            }
        }
        button.addEventListener('click', async () => {
            if (asking) return;
            lock(true);
            const first = await (await fetch(`/api/jobs/${id}/log`)).json();
            before = first.ok && first.log ? first.log.received_at : null;
            const data = await post(`/api/jobs/${id}/log`);
            if (!data.ok) { status.textContent = data.message || 'Failed.'; lock(false); return; }
            status.textContent = data.message;
            stopLog();
            let tries = 0;
            logTimer = setInterval(() => { if (++tries > 40) { stopLog(); lock(false); status.textContent = 'The worker has not answered yet. Try again in a moment.'; return; } look(true); }, 2000);
        });
        look(false);
        return box;
    }
})();
</script>
