{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-terminal"></i> System Execution Logs</h2>
    <div class="d-flex gap-2 align-items-center">
        <div class="form-check form-switch me-3 mb-0">
            <input class="form-check-input" type="checkbox" id="autoRefreshToggle" checked>
            <label class="form-check-label text-light" for="autoRefreshToggle">Auto Refresh (3s)</label>
        </div>
        <button id="btnRefreshLogs" class="btn btn-sm btn-outline-info">
            <i class="bi bi-arrow-clockwise"></i> Refresh Now
        </button>
        <button id="btnClearLogs" class="btn btn-sm btn-outline-danger">
            <i class="bi bi-trash"></i> Clear View
        </button>
    </div>
</div>

<!-- Log Level Filters -->
<div class="row g-2 mb-3 p-2 rounded" style="background-color: #1f252d; border: 1px solid #2c3440;">
    <div class="col-md-3">
        <select id="logLevelFilter" class="form-select form-select-sm">
            <option value="">All Log Levels</option>
            <option value="INFO">INFO</option>
            <option value="WARNING">WARNING</option>
            <option value="ERROR">ERROR</option>
        </select>
    </div>
    <div class="col-md-5">
        <input type="text" id="logSearch" class="form-control form-control-sm" placeholder="Filter log text...">
    </div>
    <div class="col-md-4 text-end text-muted align-self-center">
        <small id="logCount">Showing 0 lines</small>
    </div>
</div>

<!-- Terminal Display Console -->
<div class="card bg-black border-secondary">
    <div class="card-body p-3">
        <pre id="logConsole" style="height: 600px; overflow-y: auto; font-family: 'Courier New', Courier, monospace; font-size: 0.85rem; color: #33ff33; white-space: pre-wrap; margin-bottom: 0;">Loading logs...</pre>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const consoleElem = document.getElementById("logConsole");
    const levelFilter = document.getElementById("logLevelFilter");
    const searchInput = document.getElementById("logSearch");
    const autoRefreshToggle = document.getElementById("autoRefreshToggle");
    const btnRefresh = document.getElementById("btnRefreshLogs");
    const btnClear = document.getElementById("btnClearLogs");
    const logCountElem = document.getElementById("logCount");

    let rawLogLines = [];

    function fetchLogs() {
        fetch("/api/logs")
            .then(res => res.json())
            .then(data => {
                rawLogLines = data.logs || [];
                renderLogs();
            })
            .catch(err => {
                consoleElem.textContent = "Error loading log output: " + err;
            });
    }

    function renderLogs() {
        const levelVal = levelFilter.value;
        const searchVal = searchInput.value.toLowerCase();

        let filtered = rawLogLines.filter(line => {
            const matchesLevel = !levelVal || line.includes(`[${levelVal}]`);
            const matchesSearch = !searchVal || line.toLowerCase().includes(searchVal);
            return matchesLevel && matchesSearch;
        });

        consoleElem.textContent = filtered.join("\n") || "No matching logs found.";
        logCountElem.textContent = `Showing ${filtered.length} / ${rawLogLines.length} lines`;

        // Auto scroll to bottom of logs
        consoleElem.scrollTop = consoleElem.scrollHeight;
    }

    btnRefresh.addEventListener("click", fetchLogs);
    btnClear.addEventListener("click", () => {
        consoleElem.textContent = "";
        logCountElem.textContent = "Console cleared.";
    });

    levelFilter.addEventListener("change", renderLogs);
    searchInput.addEventListener("input", renderLogs);

    setInterval(() => {
        if (autoRefreshToggle.checked) {
            fetchLogs();
        }
    }, 3000);

    fetchLogs();
});
</script>
{% endblock %}
