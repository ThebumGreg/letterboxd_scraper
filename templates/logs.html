<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live Logs - Letterboxd Manager</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="/">Letterboxd Manager</a>
    <div class="navbar-nav me-auto">
      <a class="nav-link" href="/">Dashboard</a>
      <a class="nav-link" href="/settings">Settings</a>
      <a class="nav-link active" href="/logs">Logs</a>
    </div>
  </div>
</nav>

<div class="container my-4">
    <div class="card shadow-sm">
        <div class="card-header bg-white d-flex justify-content-between align-items-center">
            <h5 class="mb-0 fw-bold">Live Execution Log Stream</h5>
            <div class="d-flex align-items-center gap-2">
                <div class="form-check form-switch mb-0">
                    <input class="form-check-input" type="checkbox" id="autoRefreshToggle" checked>
                    <label class="form-check-label fw-bold" for="autoRefreshToggle">Auto-Refresh (3s)</label>
                </div>
                <button class="btn btn-sm btn-outline-secondary" onclick="fetchLogs()">Refresh Now</button>
            </div>
        </div>
        <div class="card-body bg-dark text-light">
            <pre id="logContainer" style="max-height: 600px; overflow-y: auto;" class="mb-0"><code>Loading logs...</code></pre>
        </div>
    </div>
</div>

<script>
function fetchLogs() {
    fetch('/api/logs')
    .then(r => r.json())
    .then(data => {
        const container = document.getElementById("logContainer");
        const codeBlock = container.querySelector("code");
        codeBlock.innerText = data.logs || "No logs available.";
        container.scrollTop = container.scrollHeight;
    });
}

setInterval(() => {
    if(document.getElementById("autoRefreshToggle").checked) {
        fetchLogs();
    }
}, 3000);

fetchLogs();
</script>
</body>
</html>
