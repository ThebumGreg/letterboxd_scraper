<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyncHub | Letterboxd & Serializd Pipeline</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #14181c;
            color: #e1e7ed;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .navbar {
            background-color: #1f252d !important;
            border-bottom: 1px solid #2c3440;
        }
        .card {
            background-color: #1f252d;
            border: 1px solid #2c3440;
            color: #e1e7ed;
        }
        .form-control, .form-select {
            background-color: #2c3440;
            border-color: #456;
            color: #fff;
        }
        .form-control:focus, .form-select:focus {
            background-color: #2c3440;
            border-color: #00e054;
            color: #fff;
            box-shadow: none;
        }
        .table-dark {
            --bs-table-bg: #1f252d;
            --bs-table-border-color: #2c3440;
            color: #e1e7ed;
        }
        .badge-movie {
            background-color: #00e054;
            color: #14181c;
            font-weight: 600;
        }
        .badge-tv {
            background-color: #40bcf4;
            color: #14181c;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold text-light" href="/">
                <span class="text-success">Sync</span>Hub
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link text-light" href="/">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-light" href="/tools">Tools & Operations</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-light" href="/settings">Settings</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-light" href="/logs">Logs</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container pb-5">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
