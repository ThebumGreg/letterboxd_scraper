<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101418">
<meta name="color-scheme" content="dark">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SyncHub Remote">
<link rel="apple-touch-icon" href="/static/pwa/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/static/pwa/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<title>SyncHub TVs</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>TVs</h1>
  <nav id="nav" class="tabs"></nav>
</header>
<div id="banner" hidden></div>
<div id="notices"></div>
<main class="page-narrow">
  <section id="tvCard">
    <h2>Your TVs <button data-act="tvNew" class="small primary">+ Add manually</button></h2>
    <div id="tvList" class="dim">Loading…</div>
    <div id="tvFileNote" class="small dim"></div>
  </section>

  <section id="scanCard">
    <h2>Find TVs on your network</h2>
    <div class="small dim">Looks for Roku and Google TV / Android TV devices that are switched on. TVs in deep standby do not answer, so wake them first.</div>
    <div class="row">
      <label class="small dim grow">Address range to scan
        <input id="scanRanges" placeholder="192.168.1.0/24" aria-label="Address ranges to scan, comma separated"></label>
      <button data-act="tvScan" id="scanBtn" class="primary">Scan network</button>
    </div>
    <div id="scanState" class="small dim" role="status"></div>
    <div id="found"></div>
  </section>
</main>

<dialog id="tvForm">
  <form method="dialog" id="tvFormEl" autocomplete="off">
    <div class="dlg-head"><b id="tvFormTitle">Add a TV</b><button type="button" data-act="tvCancel" class="small">✕</button></div>
    <label class="field">Name<input id="fName" placeholder="Living Room TV" maxlength="60"></label>
    <label class="field">Type
      <select id="fType">
        <option value="googletv">Google TV / Android TV</option>
        <option value="roku">Roku / Roku TV</option>
        <option value="androidtv">Android TV (ADB only)</option>
      </select></label>
    <label class="field">IP address<input id="fHost" placeholder="192.168.1.50" inputmode="decimal" autocapitalize="off" autocorrect="off"></label>
    <label class="field">MAC address <span class="dim">(optional, for Wake-on-LAN)</span><input id="fMac" placeholder="AA:BB:CC:DD:EE:FF" autocapitalize="characters" autocorrect="off"></label>
    <label class="field check" id="fAdbRow"><input type="checkbox" id="fAdb"> Also use ADB <span class="dim small">(more reliable app launching and the screensaver sleep mode; needs Network debugging enabled on the TV)</span></label>
    <label class="field">When put to sleep
      <select id="fSleep"><option value="standby">Standby</option><option value="screensaver">Screensaver (stays reachable, needs ADB)</option></select></label>
    <div id="tvFormError" class="small" style="color:var(--bad)" role="alert"></div>
    <div class="row"><button type="button" data-act="tvSave" class="primary" id="tvSaveBtn">Save</button><button type="button" data-act="tvCancel">Cancel</button></div>
  </form>
</dialog>
<script src="/static/common.js"></script>
<script src="/static/tvs.js"></script>
</body></html>
