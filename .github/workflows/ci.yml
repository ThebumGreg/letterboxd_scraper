# Runs the test suite. Pull requests and every branch except main get it directly; main and releases get it through docker-publish.yml.
name: Tests

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg    # the worker agent's tests scan real media files
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q

  image:
    # The image has to build (a wrong package name or a broken COPY would otherwise only show up when main is published).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
