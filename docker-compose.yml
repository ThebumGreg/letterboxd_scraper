# SyncHub (the main app). Start it with:   docker compose up -d --build
# Settings come from a file named .env next to this one (see .env.example); every value has a default.
services:
  synchub:
    build: .
    image: synchub:latest
    container_name: synchub
    init: true
    restart: unless-stopped
    ports:
      - "${SYNCHUB_PORT:-5001}:5001"
    environment:
      TZ: ${TZ:-UTC}
      PUID: ${PUID:-99}        # 99:100 is Unraid's nobody:users; on a normal Linux machine use your own (id -u, id -g)
      PGID: ${PGID:-100}
      # SECRET_KEY: ...        # normally not needed: the key that signs sign-ins is created once and kept in the database
    volumes:
      - "${SYNCHUB_DATA:-./data}:/data"      # database, logs, posters and backups. On Unraid use /mnt/cache/appdata/synchub
    stop_grace_period: 40s
